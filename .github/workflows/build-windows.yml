name: Đóng gói Cybergirl cho Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Kiểm thử
        shell: pwsh
        run: |
          npm test
          python cybergirl.py --tu-kiem-tra

      - name: Cài công cụ đóng gói
        run: python -m pip install -r requirements-build.txt

      - name: Tạo EXE GUI không cửa sổ lệnh
        run: pyinstaller --noconfirm --clean cybergirl.spec

      - name: Tạo bộ cài tiếng Việt
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\Cybergirl.iss

      - name: Tải artifact EXE
        uses: actions/upload-artifact@v4
        with:
          name: Cybergirl-Windows-x64
          path: |
            dist/Cybergirl-Windows-x64.exe
            dist/installer/Cybergirl-Setup-v2.0.0-Windows-x64.exe
          if-no-files-found: error
