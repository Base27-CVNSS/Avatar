name: Đóng gói Cybergirl cho Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v6

      - name: Cài Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Kiểm thử
        shell: pwsh
        run: |
          npm test
          python cybergirl.py --tu-kiem-tra

      - name: Cài công cụ đóng gói
        run: python -m pip install -r requirements-build.txt

      - name: Tạo EXE GUI không cửa sổ lệnh
        run: pyinstaller --noconfirm --clean cybergirl.spec

      - name: Tạo EXE Native Messaging Companion
        run: pyinstaller --noconfirm --clean cybergirl_companion.spec

      - name: Đóng gói Edge Extension
        shell: pwsh
        run: |
          $items = @(
            "manifest.json", "index.html", "styles.css", "app.js",
            "background.js", "characters.json", "assets", "icons", "vendor"
          )
          Compress-Archive -Path $items -DestinationPath "dist\Cybergirl-Edge-v3.0.0.zip" -CompressionLevel Optimal

      - name: Tạo bộ cài tiếng Việt
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\Cybergirl.iss

      - name: Tải artifact EXE
        uses: actions/upload-artifact@v7
        with:
          name: Cybergirl-Windows-x64
          path: |
            dist/Cybergirl-Windows-x64.exe
            dist/Cybergirl-Companion.exe
            dist/Cybergirl-Edge-v3.0.0.zip
            dist/installer/Cybergirl-Setup-v3.0.0-Windows-x64.exe
          if-no-files-found: error
