name: Triển khai trang giới thiệu Cybergirl

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v6

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Tải artifact trang tĩnh
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Triển khai
        id: deployment
        uses: actions/deploy-pages@v4
